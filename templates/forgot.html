{% extends "base.html" %}
{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1 class="form-title">🔑 找回密码</h1>

        {% if step == 1 %}
        <p class="form-hint">输入你的用户名，验证安全问题后即可重置密码</p>
        <form method="post" class="form-fields">
            <input type="text" name="username" placeholder="输入用户名" required class="input">
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary btn-block">下一步</button>
        </form>

        {% elif step == 2 %}
        <p class="form-hint">回答安全问题来验证身份</p>
        <div class="security-question-card card">
            <p class="sec-q-label">安全问题</p>
            <p class="sec-q-text">{{ question }}</p>
        </div>
        <form method="post" action="{{ url_for('reset_password') }}" class="form-fields">
            <input type="hidden" name="username" value="{{ username }}">
            <input type="text" name="answer" placeholder="输入你的答案" required class="input">
            <input type="password" name="new_password" placeholder="设置新密码（至少4位）" required class="input" minlength="4">
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary btn-block">重置密码</button>
        </form>
        {% endif %}

        <p class="form-footer">
            <a href="{{ url_for('login') }}">← 返回登录</a>
        </p>
    </div>
</div>
{% endblock %}
