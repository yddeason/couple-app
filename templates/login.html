{% extends "base.html" %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <h1 class="login-title">💑 我们的空间</h1>
        <p class="login-sub">只属于两个人的小世界</p>

        {% if success %}
        <p class="success">{{ success }}</p>
        {% endif %}

        <form method="post" class="login-form">
            <input type="text" name="username" placeholder="用户名" required class="input">
            <input type="password" name="password" placeholder="密码" required class="input">
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>

        <div class="login-links">
            <a href="{{ url_for('register') }}">注册账号</a>
            <span class="login-links-divider">|</span>
            <a href="{{ url_for('forgot') }}">忘记密码</a>
        </div>
    </div>
</div>
{% endblock %}
